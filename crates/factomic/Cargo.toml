[package]
name = "factomic"
version = "0.3.1"
description = "Unitemporal, embedded fact database backed by fjall with typed entity handles and ordered list operations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["derive"]
derive = ["dep:factomic-derive"]

[dependencies]
factomic-derive = { path = "../factomic-derive", version = "0.3.1", optional = true }
fjall.workspace = true
thiserror.workspace = true
jiff.workspace = true
fractional_index.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
itertools.workspace = true

[dev-dependencies]
tempfile = "3"
trybuild = "1"
