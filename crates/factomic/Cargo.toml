[package]
name = "factomic"
version = "0.2.0"
description = "Unitemporal, embedded fact database backed by fjall with typed entity handles and ordered list operations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["derive"]
derive = ["dep:factomic-derive"]

[dependencies]
factomic-derive = { path = "../factomic-derive", version = "0.2.0", optional = true }
fjall.workspace = true
thiserror.workspace = true
jiff.workspace = true
fractional_index.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
itertools.workspace = true

[dev-dependencies]
criterion = "0.8"
heed = "0.23.1"
redb = "5.0"
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"
trybuild = "1"

[[bench]]
name = "core"
path = "benches/core.rs"
harness = false

[[bench]]
name = "compare"
path = "benches/compare.rs"
harness = false
