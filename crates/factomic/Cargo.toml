[package]
name = "factomic"
version = "0.3.2"
description = "Unitemporal, embedded fact database backed by fjall with typed entity handles and ordered list operations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["derive"]
derive = ["dep:factomic-derive"]
bigdecimal = ["dep:bigdecimal"]
bytes = ["dep:bytes"]
camino = ["dep:camino"]
chrono = ["dep:chrono"]
http = ["dep:http"]
ipnet = ["dep:ipnet"]
jiff-extended = []
num-bigint = ["dep:num-bigint"]
rust_decimal = ["dep:rust_decimal"]
semver = ["dep:semver"]
serde-json = ["dep:serde_json"]
time = ["dep:time"]
ulid = ["dep:ulid"]
url = ["dep:url"]
uuid = ["dep:uuid"]

[dependencies]
factomic-derive = { path = "../factomic-derive", version = "0.3.2", optional = true }
fjall.workspace = true
thiserror.workspace = true
jiff.workspace = true
fractional_index.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
itertools.workspace = true
bigdecimal = { version = "0.4.11", optional = true }
bytes = { version = "1.12.2", optional = true }
camino = { version = "1.2.6", optional = true }
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
], optional = true }
http = { version = "1.5.0", optional = true }
ipnet = { version = "2.12.2", optional = true }
num-bigint = { version = "0.5.1", optional = true }
rust_decimal = { version = "1.43.0", optional = true }
semver = { version = "1.0.28", optional = true }
serde_json = { version = "1.0.154", optional = true }
time = { version = "0.3.55", features = [
    "formatting",
    "parsing",
], optional = true }
ulid = { version = "3.0.0", optional = true }
url = { version = "2.5.9", optional = true }
uuid = { version = "1.29.3", optional = true }

[dev-dependencies]
tempfile = "3"
trybuild = "1"
