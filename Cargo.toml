[workspace]
resolver = "3"
members = ["crates/factomic", "crates/factomic-derive", "crates/factomic-example"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Monitor221hz/factomic"

[workspace.dependencies]
fjall = { version = "3.1.13", features = ["lz4"] }
thiserror = "2.0.21"
jiff = { version = "1.0.0", features = ["std"] }
fractional_index = { version = "2.0.2", default-features = false }
parking_lot = "0.13.0"
arc-swap = "1.9.5"
itertools = "0.15.0"
