name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run tests and package dry-runs without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --no-deps |
            jq -e --arg tag "${GITHUB_REF_NAME#v}" '
              def check($name):
                . as $root |
                $root.packages[] |
                select(.name == $name) |
                if .version != $tag then
                  error("\($name) version \(.version) does not match tag \($tag)")
                else
                  true
                end;
              (check("factomic") and check("factomic-derive")) and
              (.packages[] |
                select(.name == "factomic") |
                .dependencies[] |
                select(.name == "factomic-derive") |
                if .req != ("^" + $tag) then
                  error("factomic-derive requirement \(.req) does not match tag \($tag)")
                else
                  true
                end)
            '
      - run: cargo test --workspace --exclude factomic-benches --all-features
      - run: cargo publish --dry-run --workspace
      - if: github.event.inputs.dry_run != 'true'
        run: cargo publish --workspace --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
